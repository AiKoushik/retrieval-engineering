name: Bug report
description: The code fails or gives a result it shouldn't.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran and its full output or traceback.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: chapter
    attributes:
      label: Chapter or module
      placeholder: "e.g. chapter 5, rx.book1.ch05"
  - type: dropdown
    id: setup
    attributes:
      label: Setup
      options:
        - Docker (docker compose)
        - Local Python and Postgres
        - Google Colab
        - Other
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: >-
        The output of `python --version`, `psql --version`, and
        `SELECT extname, extversion FROM pg_extension;`, and the
        commit (`git rev-parse --short HEAD`).
      render: text
